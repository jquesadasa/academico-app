name: CI-CD Vercel

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET dependencies
        run: dotnet restore AcademicoApp.slnx

      - name: Build .NET solution
        run: dotnet build AcademicoApp.slnx --configuration Release --no-restore

      - name: Run .NET tests
        run: dotnet test AcademicoApp.slnx --configuration Release --no-build --verbosity normal

  frontend-tests:
    name: Run Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AcademicoWeb/package-lock.json

      - name: Install frontend dependencies
        working-directory: AcademicoWeb
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2; do
            if npm ci --no-audit --prefer-offline; then
              exit 0
            fi

            echo "npm ci failed on attempt ${attempt}; retrying..."
            npm cache verify || true
          done

          echo "Falling back to npm install after repeated npm ci failures."
          npm install --no-audit --prefer-offline

      - name: Run frontend tests
        working-directory: AcademicoWeb
        run: npm run test -- --watch=false

  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger production deploy hook
        run: |
          curl --fail-with-body --silent --show-error -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

      - name: Validate production URL after deploy
        shell: bash
        run: |
          set -euo pipefail
          url="https://academico-app-ajuanjo-gmailcoms-projects.vercel.app/"
          echo "Validating Vercel production URL: ${url}"

          for attempt in {1..30}; do
            status_code="$(curl --silent --location --output /tmp/vercel_body.html --write-out '%{http_code}' "${url}")"

            if [ "${status_code}" = "200" ]; then
              if grep -Eiq '<app-root|academico' /tmp/vercel_body.html; then
                echo "Production validation succeeded on attempt ${attempt}."
                exit 0
              fi
            fi

            echo "Attempt ${attempt}/30 not ready yet (status: ${status_code}). Retrying in 20s..."
            sleep 20
          done

          echo "Production validation failed for ${url}."
          echo "Last response snippet:"
          head -n 40 /tmp/vercel_body.html || true
          exit 1

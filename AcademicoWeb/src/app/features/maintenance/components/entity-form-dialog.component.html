<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content class="glass-card form-dialog-content">
  <form [formGroup]="form" class="form-grid">
    @for (field of editableFields; track field.name) {
      @if (field.type === 'boolean') {
        <mat-checkbox [formControlName]="field.name">{{ field.name }}</mat-checkbox>
      } @else {
        <mat-form-field appearance="outline">
          <mat-label>{{ field.name }}</mat-label>
          <input
            matInput
            [type]="field.type === 'number' ? 'number' : field.type === 'date' ? 'datetime-local' : 'text'"
            [formControlName]="field.name"
          />
          @if (form.controls[field.name].invalid && form.controls[field.name].touched) {
            <mat-error>Campo requerido</mat-error>
          }
        </mat-form-field>
      }
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button (click)="submit()">Guardar</button>
</mat-dialog-actions>
